<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="100%" stop-color="#080d16"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <rect x="80" y="120" width="1240" height="620" rx="22" fill="#111b2a" stroke="#374a62"/>
  <rect x="120" y="170" width="1160" height="90" rx="18" fill="#1b2432" stroke="#394a62"/>
  <circle cx="180" cy="215" r="26" fill="#f54d4d"/>
  <text x="167" y="225" font-size="30">🧑</text>
  <text x="220" y="222" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#edf4ff">what are scope 1 emissions of wipro?</text>

  <rect x="120" y="290" width="1160" height="300" rx="18" fill="#171f2d" stroke="#394a62"/>
  <circle cx="180" cy="362" r="24" fill="#f5a623"/>
  <text x="168" y="372" font-size="28">🧑</text>
  <text x="220" y="367" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#edf4ff">Based on the provided evidence, Wipro’s current reported Scope 1 emissions are 6,515 tCO2e</text>
  <text x="220" y="410" font-family="Arial, sans-serif" font-size="28" fill="#edf4ff">(metric tonnes of CO2 equivalent) for the financial year (Wipro, FY 2023-2024, Page 43).</text>
  <text x="220" y="465" font-family="Arial, sans-serif" font-size="30" fill="#edf4ff">This total consists of:</text>
  <text x="260" y="510" font-family="Arial, sans-serif" font-size="26" fill="#dfe7f7">• Fuel: 2,653 tCO2e (Wipro, FY 2023-2024, Page 43)</text>
  <text x="260" y="548" font-family="Arial, sans-serif" font-size="26" fill="#dfe7f7">• Refrigerant: 3,863 tCO2e (Wipro, FY 2023-2024, Page 43)</text>
  <text x="220" y="605" font-family="Arial, sans-serif" font-size="28" fill="#edf4ff">Additionally, the evidence notes a historical Scope 1 baseline figure of 195,453 tonnes CO2e</text>
  <text x="220" y="640" font-family="Arial, sans-serif" font-size="28" fill="#edf4ff">established for the year 2017.</text>

  <rect x="120" y="620" width="1160" height="78" rx="16" fill="#1b2432" stroke="#394a62"/>
  <text x="170" y="666" font-family="Arial, sans-serif" font-size="30" fill="#d9e2f0">Ask a question about the uploaded reports...</text>
  <rect x="1225" y="640" width="36" height="36" rx="8" fill="#1f2a39" stroke="#dfe7f7"/>
  <text x="1236" y="666" font-size="28" fill="#edf4ff">↑</text>
