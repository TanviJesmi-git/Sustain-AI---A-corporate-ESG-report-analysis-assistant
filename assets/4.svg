<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="100%" stop-color="#080d16"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <rect x="80" y="110" width="1240" height="640" rx="22" fill="#111b2a" stroke="#374a62"/>
  <rect x="120" y="160" width="1160" height="92" rx="18" fill="#1b2432" stroke="#394a62"/>
  <circle cx="180" cy="208" r="26" fill="#f54d4d"/>
  <text x="167" y="218" font-size="30">🧑</text>
  <text x="220" y="216" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#edf4ff">Compare scope 1 emissions of TCS &amp; wipro.</text>

  <rect x="120" y="285" width="1160" height="290" rx="18" fill="#171f2d" stroke="#394a62"/>
  <circle cx="180" cy="355" r="24" fill="#f5a623"/>
  <text x="168" y="365" font-size="28">🧑</text>
  <text x="220" y="358" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#edf4ff">Based on the provided evidence, a direct comparison of the current Scope 1 emissions between</text>
  <text x="220" y="396" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#edf4ff">TCS and Wipro is not possible because the data is reported for different financial years.</text>
  <text x="220" y="455" font-family="Arial, sans-serif" font-size="28" fill="#edf4ff">Here is what each company reports for Scope 1 emissions:</text>
  <text x="260" y="510" font-family="Arial, sans-serif" font-size="26" fill="#dfe7f7">• TCS (FY 2023-2024): Reports total Scope 1 emissions of 21,949.0 tCO2e</text>
  <text x="260" y="548" font-family="Arial, sans-serif" font-size="26" fill="#dfe7f7">• Wipro (FY 2023-2024): Reports a current Scope 1 emissions figure of 6,515 tCO2e</text>
  <text x="260" y="586" font-family="Arial, sans-serif" font-size="26" fill="#dfe7f7">• Both values are presented in separate reporting frameworks and time periods.</text>

  <rect x="120" y="610" width="1160" height="78" rx="16" fill="#1b2432" stroke="#394a62"/>
  <text x="170" y="656" font-family="Arial, sans-serif" font-size="30" fill="#d9e2f0">Ask a question about the uploaded reports...</text>
  <rect x="1225" y="630" width="36" height="36" rx="8" fill="#1f2a39" stroke="#dfe7f7"/>
  <text x="1236" y="656" font-size="28" fill="#edf4ff">↑</text>
</svg>
