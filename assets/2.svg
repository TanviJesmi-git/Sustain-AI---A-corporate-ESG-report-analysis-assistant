  <text x="220" y="366" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#edf4ff">Based on the provided evidence, TCS reports the following regarding its Scope 1 emissions:</text>
  <text x="220" y="420" font-family="Arial, sans-serif" font-size="28" fill="#edf4ff">• Current Total Scope 1 Emissions:</text>
  <text x="260" y="460" font-family="Arial, sans-serif" font-size="24" fill="#dfe7f7">○ FY 2023-24: 21,949.0 metric tonnes of CO2 equivalent (TCS, FY 2023-2024, Page 27)</text>
  <text x="260" y="496" font-family="Arial, sans-serif" font-size="24" fill="#dfe7f7">○ FY 2022-23: 20,972.0 metric tonnes of CO2 equivalent (TCS, FY 2023-2024, Page 27)</text>
  <text x="220" y="545" font-family="Arial, sans-serif" font-size="28" fill="#edf4ff">• Current Scope 1 Emissions Breakdown (for FY 2023-24):</text>
  <text x="260" y="585" font-family="Arial, sans-serif" font-size="24" fill="#dfe7f7">○ CO2: 6,600.0 tCO2e</text>
  <text x="260" y="615" font-family="Arial, sans-serif" font-size="24" fill="#dfe7f7">○ CH4: 5.4 tCO2e</text>
  <text x="260" y="645" font-family="Arial, sans-serif" font-size="24" fill="#dfe7f7">○ N2O: 34.5 tCO2e</text>

